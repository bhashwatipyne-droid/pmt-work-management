<!doctype html>
<html lang="en">
    <head>
        <!-- Google tag (gtag.js). The queue (dataLayer/gtag) is set up straight
             away so nothing is lost, but the tag's own script is only downloaded
             once the page has loaded and the browser is idle, so it never
             competes with the app's first paint. -->
        <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());

            gtag('config', 'G-CBREH0JJD5');

            window.addEventListener('load', function () {
                var loadTag = function () {
                    var s = document.createElement('script');
                    s.async = true;
                    s.src = 'https://www.googletagmanager.com/gtag/js?id=G-CBREH0JJD5';
                    document.head.appendChild(s);
                };
                if ('requestIdleCallback' in window) {
                    window.requestIdleCallback(loadTag, { timeout: 4000 });
                } else {
                    setTimeout(loadTag, 2000);
                }
            });
        </script>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#000000" />
        <meta name="description" content="TheFinpedia Project Management" />
        <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
        <link rel="icon" type="image/png" sizes="192x192" href="%PUBLIC_URL%/pmt-notification-icon.png" />
        <link rel="apple-touch-icon" href="%PUBLIC_URL%/pmt-notification-icon.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <!-- A normal stylesheet link blocks the first paint until Google's server
             answers (a cross-ocean round trip for many people). Loading it as a
             preload that turns into a stylesheet when it arrives lets the page
             paint right away in the system font; display=swap then swaps Inter
             and Manrope in. -->
        <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
        <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600&display=swap" /></noscript>
        <!--
        manifest.json provides metadata used when your web app is installed on a
        user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
        -->
        <!--
        Notice the use of %PUBLIC_URL% in the tags above.
        It will be replaced with the URL of the `public` folder during the build.
        Only files inside the `public` folder can be referenced from the HTML.

        Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
        work correctly both with client-side routing and a non-root public URL.
        Learn how to configure a non-root public URL by running `npm run build`.
        -->
        <title>TheFinpedia | Project Management</title>
        <script>window.addEventListener("error",function(e){if(e.error instanceof DOMException&&e.error.name==="DataCloneError"&&e.message&&e.message.includes("PerformanceServerTiming")){e.stopImmediatePropagation();e.preventDefault()}},true);</script>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>

      To create a production bundle, use `npm run build` or `yarn build`.
    -->
    </body>
</html>
