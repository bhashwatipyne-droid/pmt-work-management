<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PMT Product Film</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --b50:#f0f0fd;--b100:#dcdcf8;--b200:#9090ec;--b400:#3d3dcc;--b500:#2b2bb5;--b700:#1a1a8a;
  --n50:#f9fafb;--n100:#f5f6f8;--n150:#f3f4f6;--n200:#eff0f2;--n300:#d1d5db;--n400:#8a97b5;--n500:#546490;--n700:#4a5878;--n900:#0d1b3e;
  --line:#e2e8f0;--cell:#eaeef4;--head:#f7f9fc;
  --ui:"Inter",-apple-system,"Segoe UI",sans-serif;--disp:"Manrope","Inter",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0b1024;overflow:hidden}
body{font-family:var(--ui);color:var(--n900);-webkit-font-smoothing:antialiased}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#eef1f8;transform-origin:center;flex:none}
.abs{position:absolute}
/* backdrop */
#bg{position:absolute;inset:0}
#bg .glow{position:absolute;border-radius:50%;filter:blur(90px)}
#dots{position:absolute;inset:-40px;background-image:radial-gradient(rgba(43,43,181,.13) 1.2px,transparent 1.3px);background-size:28px 28px}
#bignum{position:absolute;right:-30px;bottom:-150px;font:800 640px/1 var(--disp);color:transparent;-webkit-text-stroke:2px rgba(43,43,181,.09);letter-spacing:-30px}
/* captions */
.cap{position:absolute;left:112px;top:0;width:470px}
.cap .eb{font:700 15px/20px var(--disp);letter-spacing:.14em;text-transform:uppercase;color:var(--b500);display:flex;align-items:center;gap:12px}
.cap .eb i{display:block;height:2px;width:34px;background:var(--b500);border-radius:2px}
.cap .hl{margin-top:22px;font:800 64px/70px var(--disp);letter-spacing:-.035em;color:var(--n900)}
.cap .ln{display:block;overflow:hidden;padding-bottom:6px;margin-bottom:-6px}
.cap .ln>span{display:inline-block}
.cap .sb{margin-top:26px;font:500 20px/30px var(--ui);color:var(--n500);max-width:430px}
.hl em{font-style:normal;color:var(--b500)}
/* window */
#cam{position:absolute;left:0;top:0;width:1920px;height:1080px;perspective:2400px}
#win{position:absolute;left:280px;top:120px;width:1360px;height:840px;border-radius:18px;background:#fff;overflow:hidden;
  box-shadow:0 0 0 1px rgba(13,27,62,.06),0 40px 90px -20px rgba(13,27,62,.35),0 18px 36px -18px rgba(43,43,181,.25);transform-style:preserve-3d}
#side{position:absolute;left:0;top:0;bottom:0;width:236px;background:#f5f6f8;box-shadow:inset -1px 0 0 #e2e8f0}
.navsec{position:absolute;left:18px;font:700 11px/14px var(--ui);letter-spacing:.05em;text-transform:uppercase;color:#546490}
.nav{position:absolute;left:10px;right:10px;height:32px;display:flex;align-items:center;gap:10px;padding:0 10px;font:500 13.5px/1 var(--ui);color:#4a5878;border-radius:7px}
.nav svg{width:16px;height:16px;flex:none}
.nav .cnt{margin-left:auto}
#navhl{position:absolute;left:10px;right:10px;height:32px;border-radius:7px;background:#fff;box-shadow:0 0 0 1px #eaeef4,0 1px 2px rgba(13,27,62,.06)}
.pill{display:inline-flex;height:18px;min-width:20px;align-items:center;justify-content:center;border-radius:99px;padding:0 6px;font:600 11px/18px var(--ui)}
.pill.err{background:#fff5f5;color:#ef4444}.pill.brand{background:#2b2bb5;color:#fff}
#top{position:absolute;left:236px;right:0;top:0;height:52px;box-shadow:inset 0 -1px 0 #eaeef4;display:flex;align-items:center;padding:0 28px;gap:8px;font:500 13px/1 var(--ui);color:#8a97b5}
#crumb{position:relative;height:18px;overflow:hidden;min-width:300px}
#crumb div{position:absolute;left:0;top:0;height:18px;line-height:18px;white-space:nowrap}
#crumb b{color:#0d1b3e;font-weight:600}
#content{position:absolute;left:264px;top:80px;width:1068px;height:740px;overflow:hidden}
.panel{position:absolute;inset:0}
.ttl{position:absolute;left:0;top:0;font:700 24px/32px var(--disp);letter-spacing:-.02em;color:#0d1b3e}
.tabs{position:absolute;top:2px;display:flex;gap:2px;padding:3px;border-radius:9px;background:#f5f6f8;box-shadow:inset 0 0 0 1px #eff0f2}
.tabs span{height:24px;padding:0 10px;border-radius:6px;font:600 12px/24px var(--ui);color:#546490;display:flex;align-items:center;gap:6px}
.tabs span.on{background:#fff;color:#0d1b3e;box-shadow:0 1px 2px rgba(13,27,62,.08),0 0 0 1px #eaeef4}
.btn{position:absolute;height:32px;border-radius:7px;display:inline-flex;align-items:center;gap:6px;padding:0 14px;font:600 12.5px/1 var(--ui);white-space:nowrap}
.btn.p{background:#2b2bb5;color:#fff}.btn.s{background:#f5f6f8;color:#4a5878;box-shadow:inset 0 0 0 1px #eff0f2}
.card{position:absolute;background:#fff;border-radius:12px;box-shadow:inset 0 0 0 1px #eaeef4}
.badge{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;border-radius:99px;font:600 11px/20px var(--ui);white-space:nowrap}
.badge i{width:6px;height:6px;border-radius:50%;display:block}
.sbadge{display:inline-flex;align-items:center;height:21px;padding:0 9px;border-radius:99px;border:1px solid;font:500 11.5px/1 var(--ui);white-space:nowrap}
.eyebrow{font:700 11px/16px var(--disp);letter-spacing:.06em;text-transform:uppercase;color:#546490}
/* sheet */
#grid{position:absolute;left:0;top:104px;width:1068px;height:620px;border-radius:10px;overflow:hidden;box-shadow:inset 0 0 0 1px #e2e8f0;background:#fff}
.gh{position:absolute;top:0;height:34px;background:#f7f9fc;border-right:1px solid #e2e8f0;border-bottom:1px solid #e2e8f0;font:600 12px/34px var(--ui);color:#4a5878;padding:0 10px;white-space:nowrap}
.gr{position:absolute;left:0;width:1068px;height:42px}
.gc{position:absolute;top:0;height:42px;border-right:1px solid #eaeef4;border-bottom:1px solid #eaeef4;font:400 13px/42px var(--ui);color:#0d1b3e;padding:0 10px;white-space:nowrap;overflow:hidden}
.gc.num{background:#f7f9fc;color:#8a97b5;text-align:center;font-size:11.5px;padding:0;border-right-color:#e2e8f0}
.stage{display:inline-flex;align-items:center;gap:6px;font:500 12.5px/1 var(--ui)}
.stage i{width:7px;height:7px;border-radius:2px;display:block}
#ring{position:absolute;border:2px solid #2b2bb5;border-radius:2px;box-shadow:0 0 0 3px rgba(43,43,181,.14);pointer-events:none}
#sel{position:absolute;background:rgba(43,43,181,.07);border:2px solid #2b2bb5;border-radius:2px}
.menu{position:absolute;background:#fff;border-radius:12px;padding:6px;box-shadow:0 0 0 1px #eaeef4,0 6px 25px rgba(13,28,61,.14)}
.mi{height:32px;border-radius:7px;padding:0 8px;display:flex;align-items:center;gap:9px;font:500 13px/1 var(--ui);color:#0d1b3e}
/* kanban */
.col{position:absolute;top:148px;width:258px}
.colh{height:36px;border-radius:9px;display:flex;align-items:center;gap:8px;padding:0 12px;font:600 13px/1 var(--ui);border:1px solid}
.colh i{width:8px;height:8px;border-radius:50%}
.colh .n{margin-left:auto;font:600 12px/1 var(--ui);color:#6b7280;position:relative;height:14px;overflow:hidden;width:20px;text-align:right}
.pcard{position:absolute;left:0;width:258px;height:172px;background:#fff;border:1px solid #e7e9ee;border-radius:10px;padding:16px 18px 12px}
.pcard .edge{position:absolute;left:1px;top:1px;bottom:1px;width:3px;border-radius:8px 0 0 8px}
.pcard .code{font:600 11.5px/22px var(--ui);color:#6b7280;display:flex;align-items:center;gap:10px}
.pcard .nm{margin-top:13px;font:700 15px/18px var(--ui);color:#11151c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .cl{margin-top:6px;display:flex;align-items:center;gap:7px;font:400 12.5px/15px var(--ui);color:#6b7280}
.pcard .cl i{width:6px;height:6px;border-radius:2px}
.pcard .sq{margin-top:13px;display:flex;flex-wrap:wrap;gap:4px;height:36px;align-content:flex-end}
.pcard .sq b{width:16px;height:16px;border-radius:4px;display:block}
.metric{position:absolute;top:52px;height:76px;width:255px;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 1px #eaeef4;padding:14px 16px}
.metric .v{font:800 26px/30px var(--disp);letter-spacing:-.02em;margin-top:4px}
/* approvals */
.qrow{position:absolute;left:0;width:420px;height:76px;border-radius:10px;padding:14px 16px;display:flex;gap:12px}
.av{display:inline-block;width:34px;height:34px;border-radius:50%;flex:none;font:700 13px/34px var(--ui);color:#fff;text-align:center}
.node{position:absolute;top:0;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.node svg{width:18px;height:18px}
/* planning */
.hline{position:absolute;left:0;width:1068px;height:72px;box-shadow:inset 0 -1px 0 #f3f4f6}
.chk{position:absolute;left:22px;top:26px;width:20px;height:20px;border-radius:6px;box-shadow:inset 0 0 0 1.5px #c3c8d2;display:flex;align-items:center;justify-content:center}
.chk svg{width:13px;height:13px}
.chip{position:absolute;height:30px;border-radius:8px;display:flex;align-items:center;gap:8px;padding:0 10px;font:500 12.5px/1 var(--ui);color:#0d1b3e;box-shadow:inset 0 0 0 1px #eaeef4;background:#fff;white-space:nowrap}
/* toast */
.toast{position:absolute;height:44px;border-radius:12px;background:#0d1b3e;color:#fff;display:flex;align-items:center;gap:10px;padding:0 16px 0 12px;font:600 13.5px/1 var(--ui);box-shadow:0 12px 30px rgba(13,27,62,.3);white-space:nowrap}
.toast .ok{width:22px;height:22px;border-radius:50%;background:#10b981;display:flex;align-items:center;justify-content:center}
.toast .ok svg{width:13px;height:13px}
/* palette */
#pal{position:absolute;left:370px;top:150px;width:620px;border-radius:16px;background:#fff;box-shadow:0 0 0 1px #eaeef4,0 30px 70px rgba(13,27,62,.3);overflow:hidden}
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:6px;background:#f5f6f8;box-shadow:inset 0 0 0 1px #e2e8f0,inset 0 -2px 0 #e2e8f0;font:600 11px/1 var(--ui);color:#4a5878}
/* cursor */
#cur{position:absolute;left:0;top:0;width:28px;height:28px;z-index:50;pointer-events:none}
#rip{position:absolute;left:-22px;top:-22px;width:44px;height:44px;border-radius:50%;border:2px solid #2b2bb5}
/* intro / outro */
#logo{position:absolute;left:0;top:0;width:1920px;height:1080px}
.mark{position:absolute;border-radius:22%;background:#2b2bb5;box-shadow:0 30px 60px -18px rgba(43,43,181,.6)}
#controls{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:12px;align-items:center;background:rgba(13,27,62,.85);padding:8px 14px;border-radius:12px;color:#fff;font:500 12px var(--ui);z-index:9}
#controls button{background:#2b2bb5;color:#fff;border:0;border-radius:7px;height:28px;padding:0 12px;font:600 12px var(--ui);cursor:pointer}
#scrub{width:420px}
.render #controls{display:none}
</style>
</head>
<body>
<div id="viewport"><div id="stage">
  <div id="bg">
    <div class="glow" id="g1" style="width:900px;height:900px;left:-200px;top:-300px;background:rgba(144,144,236,.45)"></div>
    <div class="glow" id="g2" style="width:800px;height:800px;right:-200px;bottom:-300px;background:rgba(59,110,246,.22)"></div>
    <div id="dots"></div>
    <div id="bignum">01</div>
  </div>
  <div id="caps"></div>
  <div id="cam"><div id="win">
    <div id="side"></div>
    <div id="top"><div id="crumb"></div><div style="margin-left:auto;display:flex;align-items:center;gap:10px">
      <span class="badge" style="background:#f5f6f8;color:#4a5878;box-shadow:inset 0 0 0 1px #eff0f2;height:28px;padding:0 12px;border-radius:7px;font-size:12px">October 2026</span>
      <span class="av" style="width:30px;height:30px;line-height:30px;font-size:12px;background:#2b2bb5">A</span></div></div>
    <div id="content"></div>
    <div id="overlay" class="abs" style="inset:0;pointer-events:none"></div>
    <div id="cur"><div id="rip"></div><svg viewBox="0 0 28 28" width="28" height="28"><path d="M5 3l17 9.5-7.4 1.9L11 21.6z" fill="#0d1b3e" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/></svg></div>
  </div></div>
  <div id="logo"></div>
</div></div>
<div id="controls"><button id="pp">Pause</button><button id="snd">Sound off</button><input id="scrub" type="range" min="0" max="76.5" step="0.01" value="0"><span id="tc">0.00s</span></div>

<script>
// ───────────────────────── engine ─────────────────────────
const DUR = 76.5;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, x) => a + (b - a) * x;
const E = {
  lin: (x) => x,
  out: (x) => 1 - Math.pow(1 - x, 3),
  out5: (x) => 1 - Math.pow(1 - x, 5),
  expo: (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x)),
  io: (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
  io5: (x) => (x < 0.5 ? 16 * x ** 5 : 1 - Math.pow(-2 * x + 2, 5) / 2),
  back: (x) => { const c = 1.9, c3 = c + 1; return 1 + c3 * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); },
  spring: (x) => (x >= 1 ? 1 : 1 - Math.exp(-6.5 * x) * Math.cos(x * 12)),
};
const P = (t, a, b, e = E.out) => e(clamp((t - a) / (b - a)));
const $ = (s) => document.querySelector(s);
const el = (parent, cls = "", style = "", html = "") => {
  const d = document.createElement("div");
  if (cls) d.className = cls;
  if (style) d.style.cssText = style;
  if (html) d.innerHTML = html;
  parent.appendChild(d);
  return d;
};
const tf = (e, { x = 0, y = 0, s = 1, sx, sy, r = 0, o } = {}) => {
  e.style.transform = `translate(${x}px,${y}px) scale(${sx ?? s},${sy ?? s}) rotate(${r}deg)`;
  if (o !== undefined) e.style.opacity = o;
};
const txt = (e, v) => { if (e._v !== v) { e._v = v; e.textContent = v; } };
const htm = (e, v) => { if (e._h !== v) { e._h = v; e.innerHTML = v; } };
const type = (s, p) => s.slice(0, Math.round(s.length * clamp(p)));
const inr = (n) => Math.round(n).toLocaleString("en-IN");
const hm = (m) => `${Math.floor(m / 60)}h ${String(Math.round(m % 60)).padStart(2, "0")}m`;
// keyframe track: [[t, value], ...] (numbers or arrays), eased per segment
const track = (keys, t, e = E.io) => {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    if (t <= keys[i][0]) {
      const [t0, a] = keys[i - 1], [t1, b, ee] = keys[i];
      const k = (ee || e)(clamp((t - t0) / (t1 - t0)));
      return Array.isArray(a) ? a.map((v, j) => lerp(v, b[j], k)) : lerp(a, b, k);
    }
  }
  return keys[keys.length - 1][1];
};
// enter / exit envelope for a scene
const env = (t, a, b, inD = 0.5, outD = 0.4) => ({ i: P(t, a, a + inD, E.out5), o: P(t, b - outD, b, E.io), on: t > a - 0.01 && t < b + 0.01 });

const ICON = {
  home: '<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>',
  planning: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01M16 18h.01"/>',
  meetings: '<path d="m22 8-6 4 6 4V8Z"/><rect x="2" y="6" width="14" height="12" rx="2"/>',
  worksheet: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  projects: '<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>',
  approvals: '<path d="m9 11 3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
  clients: '<path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2M10 6h4M10 10h4M10 14h4M10 18h4"/>',
  team: '<circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/>',
  efficiency: '<path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/>',
  invoicing: '<path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8M12 17.5v-11"/>',
  search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  filter: '<path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/>',
  send: '<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
  play: '<path d="M8 5v14l11-7z"/>',
};
const ico = (k, color = "currentColor", w = 2) =>
  `<svg viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg>`;

const STAGE = { Content: "#3b6ef6", Design: "#7c5cf6", Animate: "#e08a0b", Finish: "#0fa36b" };
const PST = {
  Active: { dot: "#3b6ef6", hb: "#f4f7ff", hbd: "#dce6fe", bb: "#eff4ff", bbd: "#cfddfc", bt: "#1d4ed8" },
  "Approval Pending": { dot: "#e08a0b", hb: "#fffbf2", hbd: "#fbe6be", bb: "#fffaeb", bbd: "#fce3a9", bt: "#b45309" },
  Completed: { dot: "#0fa36b", hb: "#f2fcf7", hbd: "#cdeedd", bb: "#ecfdf3", bbd: "#c9eedc", bt: "#047857" },
  "Ready for Invoice": { dot: "#0d9488", hb: "#f0fdfa", hbd: "#c4ebe5", bb: "#effcf9", bbd: "#bfe9e2", bt: "#0f766e" },
  "Raised Invoice": { dot: "#7c5cf6", hb: "#f7f5ff", hbd: "#e2dbfe", bb: "#f5f1fe", bbd: "#ddd2fa", bt: "#5b21b6" },
};
const WST = {
  Ongoing: ["#fef3c7", "#b45309", "#fcd34d"],
  "Ready for Review": ["#dbeafe", "#1d4ed8", "#93c5fd"],
  "Changes Requested": ["#ffe4e6", "#be123c", "#fda4af"],
  Closed: ["#d1fae5", "#047857", "#6ee7b7"],
};
const sbadge = (s) => { const [b, f, d] = WST[s]; return `<span class="sbadge" style="background:${b};color:${f};border-color:${d}">${s}</span>`; };
const pbadge = (s) => { const c = PST[s]; return `<span class="badge" style="background:${c.bb};color:${c.bt};box-shadow:inset 0 0 0 1px ${c.bbd}"><i style="background:${c.dot}"></i>${s}</span>`; };
const CLIENT = { "Northwind AMC": "#e06a4b", "Solace Capital": "#2f7d8c", "Kite Insurance": "#7c5cf6", "Meridian Bank": "#0fa36b" };
const AV = { Neha: "#e06a4b", Rahul: "#2f7d8c", Priya: "#7c5cf6", Sam: "#e08a0b", Vikram: "#3b6ef6", Aisha: "#2b2bb5" };

const stageEl = $("#stage");
const win = $("#win"), content = $("#content"), overlay = $("#overlay");
// window → content offset (content is at 264,80 inside the window)
const CX = 264, CY = 80;

// ───────────────────────── backdrop + captions ─────────────────────────
const CAPS = [

function seek(t) {
  t = clamp(t, 0, DUR);
  renderCaps(t);
  renderCamera(t);
  renderChrome(t);
  renderS1(t); renderWA(t); renderGantt(t); renderS2(t - OFF_PA); renderS3(t - OFF_PA);
  renderMeet(t); renderHome(t); renderCap(t); renderEff(t - OFF_EFF); renderS6(t - OFF_FIN);
  renderCursor(t);
  renderFormula(t - OFF_EFF);
  renderLogo(t);
}
window.seek = seek;
window.DUR = DUR;

const params = new URLSearchParams(location.search);
const RENDER = params.has("render");
if (RENDER) document.documentElement.classList.add("render");
const fit = () => {
  const s = RENDER ? 1 : Math.min(innerWidth / 1920, innerHeight / 1080);
  stageEl.style.transform = `scale(${s})`;
};
addEventListener("resize", fit); fit();

let playing = !RENDER, t0 = performance.now(), cur_t = parseFloat(params.get("t") || "0");
const scrub = $("#scrub"), tc = $("#tc"), pp = $("#pp");
const show = (t) => { seek(t); scrub.value = t; tc.textContent = t.toFixed(2) + "s"; };
// The soundtrack sits next to this file. Browsers only allow sound after a
// click, so it starts muted; while it plays, it drives the timeline.
const audio = new Audio("pmt-film-score.m4a");
audio.loop = true;
let soundOn = false;
const snd = $("#snd");
const syncAudio = () => {
  if (!soundOn) { audio.pause(); return; }
  audio.currentTime = cur_t;
  if (playing) audio.play().catch(() => {}); else audio.pause();
};
snd.onclick = () => { soundOn = !soundOn; snd.textContent = soundOn ? "Sound on" : "Sound off"; syncAudio(); };
pp.onclick = () => { playing = !playing; pp.textContent = playing ? "Pause" : "Play"; t0 = performance.now() - cur_t * 1000; syncAudio(); };
scrub.oninput = () => { cur_t = parseFloat(scrub.value); playing = false; pp.textContent = "Play"; show(cur_t); syncAudio(); };
addEventListener("keydown", (e) => { if (e.code === "Space") { e.preventDefault(); pp.click(); } });
t0 = performance.now() - cur_t * 1000;
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => {
  window.READY = true;
  if (RENDER) { show(cur_t); return; }
  const loop = (now) => {
    if (playing) {
      cur_t = soundOn && !audio.paused ? audio.currentTime % DUR : ((now - t0) / 1000) % DUR;
      if (soundOn) t0 = now - cur_t * 1000;
      show(cur_t);
    }
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
});
show(cur_t);
</script>
